name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes de unidade
        run: npm test

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes de ponta a ponta (computador e celular)
        run: npm run test:e2e

      - name: Guardar o relatório quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: playwright-report
          retention-days: 7
